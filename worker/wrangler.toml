name = "pulsedesk-api"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Free plan: 100,000 requests/day. Edge caching keeps upstream calls far below that.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "pulsedesk"
database_id = "3fbe7dce-fc54-40d6-9b86-99d3c8abf0ea"

[observability]
enabled = true
